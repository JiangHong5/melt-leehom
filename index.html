<!DOCTYPE html>
<html lang="zh">
    <head>
        <meta charset="UTF-8">
        <title>刘德华解冻</title>
        <link rel="stylesheet" href="./css/styles.css">
        <link rel="stylesheet" href="https://jianghong5.github.io/all_assets/css/viewport.css">
    </head>
    <body>
        <script src="https://6tail.cn/calendar/lunar.js"></script>
        <div id="viewport">
            <nav>
                <div id="nav-items">
                    <img src="https://jianghong5.github.io/all_assets/img/icon.png" alt="icon" width="52" height="49" class="nav-item" id="icon">
                    <span class="nav-item" onclick="window.location.href='https://jianghong5.github.io/index.html'">首页</span>
                    <span class="nav-item" onclick="window.location.href='https://jianghong5.github.io/projects.html'">项目</span>
                    <span class="nav-item" onclick="window.location.href='https://jianghong5.github.io/blogs/'">博客</span>
                </div>
            </nav>
        </div>
        <div class="container-container">
            <div class="container">
                <img id="leehom" src="./img/leehom.png" alt="刘德华">
                <div id="ice" class="ice"></div>
                <button id="playBtn">播放音乐</button>
            </div>
            <audio id="song" src="./audio/gxnfc.wav" loop></audio>
                
            <script>
                deg = 360;
                
                document.addEventListener('DOMContentLoaded', function() {
                    leehom = document.getElementById('leehom');
                    ice = document.getElementById('ice');
                    song = document.getElementById('song');
                    button = document.getElementById('playBtn');
    
                    function get_spring_festival(year) {
                        var spring_festival = Lunar.fromYmd(year, 1, 1);
                        var spr_fes_solar = spring_festival.getSolar();
                        return new Date(spr_fes_solar.getYear(), spr_fes_solar.getMonth() - 1, spr_fes_solar.getDay());
                    }
    
                    function get_lantern_festival(year) {
                        var lantern_festival = Lunar.fromYmd(year, 1, 15);
                        var lan_fes_solar = lantern_festival.getSolar();
                        return new Date(lan_fes_solar.getYear(), lan_fes_solar.getMonth() - 1, lan_fes_solar.getDay() + 1);
                    }
    
                    var spring = new Date();
                    var lantern = new Date();
                    
                    var this_year = new Date().getFullYear();
                    var next_year = new Date().getFullYear() + 1;
                    var this_spr = get_spring_festival(this_year);
                    var this_lan = get_lantern_festival(this_year);
                    if (new Date() < this_spr || new Date() >= this_spr && new Date() <= this_lan) {
                        spring = this_spr;
                        lantern = this_lan;
                    }
                    else {
                        spring = get_spring_festival(next_year);
                        lantern = get_lantern_festival(next_year);
                    }
                    // console.log(`${this_spr}    ${this_lan}    ${get_spring_festival(next_year)}    ${get_lantern_festival(next_year)}`)
                    // console.log(`${spring}    ${new Date()}    &&    ${new Date()}    ${lantern}`);
                    function updateIce() {
                        let diff = spring - new Date();
                        if (diff >= 0) {
                            ice.style.height = diff / 86400000 / 365.0 * 100 + '%';
                        }
                        else {
                            ice.style.height = 0;
                        }
                    }
                
                    function rotateLeehom() {
                        deg += 360;
                        leehom.style.transform = `rotate(${deg}deg)`;
                        leehom.style.transition = `transform ${deg / 360}s linear`;
                        setTimeout(rotateLeehom, 1000);
                    }
                
                    function playSong() {
                        song.play();
                        song.loop = true;
                        song.currentTime = 0;
                    }
                
                    function stopSong() {
                        song.pause();
                        song.currentTime = 0;
                    }
                
                    function checkTime() {
                        const now = new Date();
                
                        if (now >= spring && now < lantern) {
                            rotateLeehom();
                            
                            button.style.opacity = '100%';
                        } else if (now >= lantern) {
                            stopSong();
                            button.style.opacity = '0%';
                        }
                        else {
                            button.style.opacity = '0%';
                        }
                    }
                    setInterval(() => {
                        const now = new Date();
                        if (now >= spring && now < lantern) {
                            rotateLeehom();
                        }
                    }, 1000)
                    setInterval(checkTime, 100);
                    setInterval(() => {
                        const now = new Date();
                        if (now >= spring && now < lantern) {
                            playSong();
                        } else {
                            stopSong();
                        }
                    }, 7000);
                    setInterval(updateIce, 100);
                });
        
            </script>
        </div>
    </body>
</html>
