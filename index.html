<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>刘德华解冻</title>
        <link rel="stylesheet" href="./css/styles.css">
        <link rel="stylesheet" href="https://jianghong5.github.io/all_assets/css/viewport.css">
    </head>
    <body>
        <script src="https://6tail.cn/calendar/lunar.js"></script>
        <div id="viewport">
            <nav>
                <div id="nav-items">
                    <img src="https://jianghong5.github.io/all_assets/img/icon.png" alt="icon" width="52" height="49" class="nav-item" id="icon">
                    <span class="nav-item" onclick="window.location.href='https://jianghong5.github.io/index.html'">首页</span>
                    <span class="nav-item" onclick="window.location.href='https://jianghong5.github.io/projects.html'">项目</span>
                    <span class="nav-item" onclick="window.location.href='https://jianghong5.github.io/blogs/'">博客</span>
                </div>
            </nav>
        </div>
        
        <div class="main-content">
            <div class="frost-container">
                <img id="leehom" src="./img/leehom.png" alt="刘德华">
                <div id="ice" class="ice-overlay"></div>
            </div>
            
            <div class="controls">
                <button id="playBtn" class="music-btn" aria-label="播放音乐">
                    <span class="btn-icon">▶</span>
                </button>
                <div id="countdown" class="countdown"></div>
            </div>
        </div>
        
        <audio id="song" src="./audio/gxnfc.wav"></audio>
        
        <script>
            // 配置常量
            const CONFIG = {
                ROTATION_SPEED: 180, // 每秒旋转180度
                UPDATE_INTERVAL: 100, // 更新间隔(ms)
                FESTIVAL_SEASON: {    // 节日季节定义
                    SPRING: 'spring',
                    LANTERN: 'lantern',
                    OFF_SEASON: 'off'
                }
            };
            
            // 主应用类
            class LeeHomThawApp {
                constructor() {
                    this.elements = {};
                    this.currentSeason = CONFIG.FESTIVAL_SEASON.OFF_SEASON;
                    this.rotationAngle = 0;
                    this.animationId = null;
                    this.isMusicPlaying = false;
                    this.festivalDates = {};
                    
                    this.init();
                }
                
                // 初始化
                async init() {
                    this.cacheElements();
                    this.calculateFestivalDates();
                    this.bindEvents();
                    this.startMainLoop();
                }
                
                // 缓存DOM元素
                cacheElements() {
                    this.elements = {
                        leehom: document.getElementById('leehom'),
                        ice: document.getElementById('ice'),
                        song: document.getElementById('song'),
                        playBtn: document.getElementById('playBtn'),
                        countdown: document.getElementById('countdown')
                    };
                }
                
                // 计算节日日期
                calculateFestivalDates() {
                    const currentYear = new Date().getFullYear();
                    
                    // 获取今年春节
                    const thisYearSpring = this.getFestivalDate(currentYear, 1, 1);
                    const thisYearLantern = this.getFestivalDate(currentYear, 1, 15);
                    
                    // 获取明年春节
                    const nextYearSpring = this.getFestivalDate(currentYear + 1, 1, 1);
                    
                    const now = new Date();
                    
                    // 判断当前处于哪个时间段
                    if (now < thisYearSpring) {
                        // 春节前
                        this.festivalDates = {
                            spring: thisYearSpring,
                            lantern: thisYearLantern,
                            nextSpring: nextYearSpring
                        };
                    } else if (now >= thisYearSpring && now <= thisYearLantern) {
                        // 春节期间
                        this.festivalDates = {
                            spring: thisYearSpring,
                            lantern: thisYearLantern,
                            nextSpring: nextYearSpring
                        };
                    } else {
                        // 春节后
                        this.festivalDates = {
                            spring: nextYearSpring,
                            lantern: this.getFestivalDate(currentYear + 1, 1, 15),
                            nextSpring: this.getFestivalDate(currentYear + 2, 1, 1)
                        };
                    }
                }
                
                // 获取节日日期（公历）
                getFestivalDate(year, lunarMonth, lunarDay) {
                    try {
                        const lunarDate = Lunar.fromYmd(year, lunarMonth, lunarDay);
                        const solarDate = lunarDate.getSolar();
                        return new Date(
                            solarDate.getYear(),
                            solarDate.getMonth() - 1,
                            solarDate.getDay()
                        );
                    } catch (error) {
                        console.error('计算农历日期失败:', error);
                        // 返回一个默认日期（正月初一）
                        return new Date(year, 0, 1);
                    }
                }
                
                // 绑定事件
                bindEvents() {
                    // 音乐按钮点击事件
                    this.elements.playBtn.addEventListener('click', () => {
                        this.toggleMusic();
                    });
                    
                    // 页面可见性变化时暂停音乐
                    document.addEventListener('visibilitychange', () => {
                        if (document.hidden) {
                            this.pauseMusic();
                        }
                    });
                }
                
                // 主循环
                startMainLoop() {
                    const update = () => {
                        this.updateSeasonState();
                        this.updateIceLayer();
                        this.updateCountdown();
                        this.updateRotation();
                        
                        setTimeout(() => requestAnimationFrame(update), CONFIG.UPDATE_INTERVAL);
                    };
                    
                    requestAnimationFrame(update);
                }
                
                // 更新季节状态
                updateSeasonState() {
                    const now = new Date();
                    const { spring, lantern } = this.festivalDates;
                    
                    if (now >= spring && now < lantern) {
                        this.setSeason(CONFIG.FESTIVAL_SEASON.SPRING);
                    } else if (now >= lantern) {
                        this.setSeason(CONFIG.FESTIVAL_SEASON.LANTERN);
                    } else {
                        this.setSeason(CONFIG.FESTIVAL_SEASON.OFF_SEASON);
                    }
                }
                
                // 设置当前季节
                setSeason(season) {
                    if (this.currentSeason === season) return;
                    
                    this.currentSeason = season;
                    
                    switch (season) {
                        case CONFIG.FESTIVAL_SEASON.SPRING:
                            this.startRotation();
                            this.showPlayButton();
                            this.elements.ice.style.opacity = '0';
                            break;
                            
                        case CONFIG.FESTIVAL_SEASON.LANTERN:
                            this.stopRotation();
                            this.pauseMusic();
                            this.hidePlayButton();
                            break;
                            
                        case CONFIG.FESTIVAL_SEASON.OFF_SEASON:
                            this.stopRotation();
                            this.pauseMusic();
                            this.hidePlayButton();
                            this.elements.ice.style.opacity = '0.8';
                            break;
                    }
                }
                
                // 更新冰层
                updateIceLayer() {
                    if (this.currentSeason !== CONFIG.FESTIVAL_SEASON.OFF_SEASON) return;
                    
                    const now = new Date();
                    const timeToSpring = this.festivalDates.spring - now;
                    const daysToSpring = timeToSpring / (1000 * 60 * 60 * 24);
                    
                    // 冰层高度：距离春节的天数比例（最多100%）
                    const maxDays = 90; // 最多显示90天的倒计时
                    const iceHeight = Math.min(100, (daysToSpring / maxDays) * 100);
                    
                    this.elements.ice.style.height = `${iceHeight}%`;
                }
                
                // 更新倒计时显示
                updateCountdown() {
                    const now = new Date();
                    const timeToSpring = this.festivalDates.spring - now;
                    
                    if (timeToSpring <= 0 || this.currentSeason === CONFIG.FESTIVAL_SEASON.SPRING) {
                        this.elements.countdown.textContent = '恭喜发财！';
                        return;
                    }
                    
                    const days = Math.floor(timeToSpring / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((timeToSpring % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    
                    this.elements.countdown.textContent = `解冻倒计时: ${days}天${hours}小时`;
                }
                
                // 更新旋转动画
                updateRotation() {
                    if (this.currentSeason !== CONFIG.FESTIVAL_SEASON.SPRING) return;
                    
                    this.rotationAngle += (CONFIG.ROTATION_SPEED * CONFIG.UPDATE_INTERVAL) / 1000;
                    if (this.rotationAngle >= 360) {
                        this.rotationAngle -= 360;
                    }
                    
                    this.elements.leehom.style.transform = `rotate(${this.rotationAngle}deg)`;
                }
                
                // 开始旋转
                startRotation() {
                    if (this.animationId) return;
                    this.rotationAngle = 0;
                }
                
                // 停止旋转
                stopRotation() {
                    this.rotationAngle = 0;
                    this.elements.leehom.style.transform = 'rotate(0deg)';
                }
                
                // 切换音乐
                toggleMusic() {
                    if (this.isMusicPlaying) {
                        this.pauseMusic();
                    } else {
                        this.playMusic();
                    }
                }
                
                // 播放音乐
                playMusic() {
                    if (this.currentSeason !== CONFIG.FESTIVAL_SEASON.SPRING) return;
                    
                    this.elements.song.play().then(() => {
                        this.isMusicPlaying = true;
                        this.elements.playBtn.classList.add('playing');
                        this.elements.playBtn.querySelector('.btn-icon').textContent = '⏸';
                    }).catch(error => {
                        console.warn('自动播放被阻止，需要用户交互:', error);
                        // 显示提示
                        this.showPlaybackHint();
                    });
                }
                
                // 暂停音乐
                pauseMusic() {
                    this.elements.song.pause();
                    this.isMusicPlaying = false;
                    this.elements.playBtn.classList.remove('playing');
                    this.elements.playBtn.querySelector('.btn-icon').textContent = '▶';
                }
                
                // 显示播放提示
                showPlaybackHint() {
                    const hint = document.createElement('div');
                    hint.className = 'playback-hint';
                    hint.innerHTML = `
                        <p>点击播放按钮播放音乐</p>
                        <small>浏览器需要用户交互才能播放音频</small>
                    `;
                    document.querySelector('.controls').appendChild(hint);
                    
                    setTimeout(() => hint.remove(), 3000);
                }
                
                // 显示播放按钮
                showPlayButton() {
                    this.elements.playBtn.style.opacity = '1';
                    this.elements.playBtn.style.pointerEvents = 'auto';
                }
                
                // 隐藏播放按钮
                hidePlayButton() {
                    this.elements.playBtn.style.opacity = '0';
                    this.elements.playBtn.style.pointerEvents = 'none';
                }
            }
            
            // 启动应用
            document.addEventListener('DOMContentLoaded', () => {
                new LeeHomThawApp();
            });
    
        </script>
        </div>
    </body>
</html>
